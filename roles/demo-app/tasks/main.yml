---
- name: Install python venv
  ansible.builtin.apt:
    name: python3-venv
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create log directory
  ansible.builtin.file:
    path: "{{ app_log_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy requirements
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ app_dir }}/requirements.txt"
    mode: "0644"
  notify: Restart demo-app

- name: Install python packages into a virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart demo-app

- name: Copy application
  ansible.builtin.copy:
    src: app.py
    dest: "{{ app_dir }}/app.py"
    mode: "0644"
  notify: Restart demo-app

- name: Install systemd service
  ansible.builtin.template:
    src: demo-app.service.j2
    dest: /etc/systemd/system/demo-app.service
    mode: "0644"
  notify: Restart demo-app

- name: Enable and start the application
  ansible.builtin.systemd:
    name: demo-app
    enabled: true
    state: started
    daemon_reload: true
