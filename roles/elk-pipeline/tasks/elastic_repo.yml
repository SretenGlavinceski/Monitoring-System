---
# same key and repository line as geerlingguy.elasticsearch, so both can
# exist on the logging hosts without apt complaining about duplicates
- name: Add Elastic apt key
  ansible.builtin.apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Add Elastic apt repository
  ansible.builtin.apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/{{ es_version }}/apt stable main"
    state: present
    update_cache: true
